# Host config for the Omarchy 10-band equalizer.
#
# Deliberately mirrors Omarchy's own speaker-tuning host (see
# /usr/share/omarchy/default/audio/filter-chain-host.conf): the EQ runs as its
# own PipeWire *client* under its own config name, so it can be restarted
# without dropping every PulseAudio client's connection, a malformed graph
# breaks only this service rather than the whole daemon, and it does not share
# PipeWire's stock filter-chain.conf.d namespace with unrelated user filters.
#
# The graph itself is merged from omarchy-eq.conf.d/.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    # Boost the audio thread priority.
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }

    # The native communication protocol.
    { name = libpipewire-module-protocol-native }

    # Lets this process provide nodes to PipeWire.
    { name = libpipewire-module-client-node }

    # Wraps nodes in an adapter with a converter and resampler.
    { name = libpipewire-module-adapter }
]
